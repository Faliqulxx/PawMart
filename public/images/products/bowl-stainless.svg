<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 240" width="100%" height="100%">
  <defs>
    <linearGradient id="bg5" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F7FAFC"/>
      <stop offset="100%" stop-color="#EDF2F7"/>
    </linearGradient>
    <linearGradient id="metal" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#E2E8F0"/>
      <stop offset="50%" stop-color="#CBD5E0"/>
      <stop offset="100%" stop-color="#A0AEC0"/>
    </linearGradient>
    <linearGradient id="rim" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#CBD5E0"/>
      <stop offset="50%" stop-color="#FFFFFF"/>
      <stop offset="100%" stop-color="#A0AEC0"/>
    </linearGradient>
    <filter id="shadow5" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#4A5568" flood-opacity="0.2"/>
    </filter>
  </defs>
  <rect width="240" height="240" rx="20" fill="url(#bg5)"/>
  <g filter="url(#shadow5)">
    <!-- Base Anti-skid Ring -->
    <ellipse cx="120" cy="165" rx="72" ry="18" fill="#E53E3E"/>
    <ellipse cx="120" cy="163" rx="68" ry="16" fill="#C53030"/>
    <!-- Bowl Body -->
    <path d="M52 110 C52 160 82 170 120 170 C158 170 188 160 188 110 Z" fill="url(#metal)"/>
    <!-- Rim -->
    <ellipse cx="120" cy="110" rx="68" ry="22" fill="url(#rim)"/>
    <!-- Inner Bowl -->
    <ellipse cx="120" cy="112" rx="56" ry="17" fill="#718096"/>
    <ellipse cx="120" cy="113" rx="52" ry="15" fill="#4A5568"/>
    <!-- Paw mark inside bowl -->
    <ellipse cx="120" cy="114" rx="8" ry="5" fill="#A0AEC0"/>
    <circle cx="113" cy="107" r="2.5" fill="#A0AEC0"/>
    <circle cx="120" cy="105" r="2.5" fill="#A0AEC0"/>
    <circle cx="127" cy="107" r="2.5" fill="#A0AEC0"/>
  </g>
  <rect x="75" y="195" width="90" height="20" rx="10" fill="#ED8936"/>
  <text x="120" y="209" font-family="system-ui, sans-serif" font-size="10" font-weight="bold" fill="#FFFFFF" text-anchor="middle">Stainless Anti-Semut</text>
</svg>
