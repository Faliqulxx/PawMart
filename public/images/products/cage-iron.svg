<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 240" width="100%" height="100%">
  <defs>
    <linearGradient id="bg11" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F7FAFC"/>
      <stop offset="100%" stop-color="#EDF2F7"/>
    </linearGradient>
    <filter id="shadow11" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#2D3748" flood-opacity="0.2"/>
    </filter>
  </defs>
  <rect width="240" height="240" rx="20" fill="url(#bg11)"/>
  <g filter="url(#shadow11)">
    <!-- Bottom Tray -->
    <rect x="50" y="168" width="140" height="18" rx="4" fill="#3182CE"/>
    <!-- Wire Cage Frame -->
    <rect x="55" y="65" width="130" height="105" rx="6" fill="#EDF2F7" stroke="#2D3748" stroke-width="4"/>
    <!-- Vertical Wire Bars -->
    <line x1="70" y1="65" x2="70" y2="170" stroke="#4A5568" stroke-width="2"/>
    <line x1="85" y1="65" x2="85" y2="170" stroke="#4A5568" stroke-width="2"/>
    <line x1="100" y1="65" x2="100" y2="170" stroke="#4A5568" stroke-width="2"/>
    <line x1="115" y1="65" x2="115" y2="170" stroke="#4A5568" stroke-width="2"/>
    <line x1="125" y1="65" x2="125" y2="170" stroke="#4A5568" stroke-width="2"/>
    <line x1="140" y1="65" x2="140" y2="170" stroke="#4A5568" stroke-width="2"/>
    <line x1="155" y1="65" x2="155" y2="170" stroke="#4A5568" stroke-width="2"/>
    <line x1="170" y1="65" x2="170" y2="170" stroke="#4A5568" stroke-width="2"/>
    <!-- Horizontal Cross Wire -->
    <line x1="55" y1="95" x2="185" y2="95" stroke="#4A5568" stroke-width="2"/>
    <line x1="55" y1="135" x2="185" y2="135" stroke="#4A5568" stroke-width="2"/>
    <!-- Door Frame -->
    <rect x="95" y="90" width="50" height="65" rx="2" fill="none" stroke="#E53E3E" stroke-width="3"/>
    <line x1="145" y1="120" x2="148" y2="125" stroke="#E53E3E" stroke-width="4" stroke-linecap="round"/>
    <!-- Top Handle -->
    <path d="M105 65 C105 50 135 50 135 65" fill="none" stroke="#2D3748" stroke-width="4"/>
  </g>
  <rect x="65" y="195" width="110" height="20" rx="10" fill="#2D3748"/>
  <text x="120" y="209" font-family="system-ui, sans-serif" font-size="10" font-weight="bold" fill="#FFFFFF" text-anchor="middle">Besi Lipat 60x42x50</text>
</svg>
