    <!-- Fish / Omega Icon -->
    <path d="M108 135 C116 128 126 128 134 135 C138 132 142 128 142 128 C142 134 138 138 134 141 C126 147 116 147 108 141 C104 138 108 135 108 135 Z" fill="#C05621"/>
