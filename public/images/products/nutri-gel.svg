<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 240" width="100%" height="100%">
  <defs>
    <linearGradient id="bg9" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#EBF8FF"/>
      <stop offset="100%" stop-color="#BEE3F8"/>
    </linearGradient>
    <linearGradient id="tube" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="50%" stop-color="#F7FAFC"/>
      <stop offset="100%" stop-color="#E2E8F0"/>
    </linearGradient>
    <filter id="shadow9" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#2B6CB0" flood-opacity="0.2"/>
    </filter>
  </defs>
  <rect width="240" height="240" rx="20" fill="url(#bg9)"/>
  <g filter="url(#shadow9)">
    <!-- Ointment / Supplement Tube angled -->
    <g transform="translate(120, 115) rotate(40) translate(-120, -115)">
      <!-- Cap -->
      <rect x="105" y="40" width="30" height="20" rx="4" fill="#3182CE"/>
      <rect x="110" y="58" width="20" height="8" fill="#2B6CB0"/>
      <!-- Tube Body -->
      <path d="M100 65 L85 175 L155 175 L140 65 Z" fill="url(#tube)"/>
      <rect x="85" y="170" width="70" height="12" rx="3" fill="#CBD5E0"/>
      <!-- Label Banner -->
      <rect x="90" y="85" width="60" height="60" rx="4" fill="#EBF8FF"/>
      <rect x="95" y="92" width="50" height="10" rx="2" fill="#E53E3E"/>
      <text x="120" y="100" font-family="system-ui, sans-serif" font-size="7" font-weight="900" fill="#FFFFFF" text-anchor="middle">NUTRI-PLUS</text>
      <!-- Medical cross -->
      <rect x="117" y="108" width="6" height="18" rx="2" fill="#3182CE"/>
      <rect x="111" y="114" width="18" height="6" rx="2" fill="#3182CE"/>
      <text x="120" y="138" font-family="system-ui, sans-serif" font-size="7" font-weight="bold" fill="#2B6CB0" text-anchor="middle">Gel 120g</text>
    </g>
  </g>
  <rect x="65" y="195" width="110" height="20" rx="10" fill="#2B6CB0"/>
  <text x="120" y="209" font-family="system-ui, sans-serif" font-size="10" font-weight="bold" fill="#FFFFFF" text-anchor="middle">Vitamin &amp; Energi Booster</text>
</svg>
