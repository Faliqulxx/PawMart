    <path d="M120 106 C124 100 128 102 128 102" stroke="#744210" stroke-width="2" fill="none"/>
    <path d="M122 104 C126 102 128 105 128 105" fill="#38A169"/>
    <text x="120" y="145" font-family="system-ui, sans-serif" font-size="8" font-weight="bold" fill="#2F855A" text-anchor="middle">Aroma Apel</text>
