<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 240" width="100%" height="100%">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFF8F0"/>
      <stop offset="100%" stop-color="#FCECD8"/>
    </linearGradient>
    <linearGradient id="bag" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#E53E3E"/>
      <stop offset="100%" stop-color="#9B2C2C"/>
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#804A26" flood-opacity="0.15"/>
    </filter>
  </defs>
  <rect width="240" height="240" rx="20" fill="url(#bg)"/>
  <g filter="url(#shadow)">
    <!-- Cat Food Bag -->
    <path d="M70 65 L85 45 L155 45 L170 65 L165 195 L75 195 Z" fill="url(#bag)"/>
    <path d="M85 45 L120 52 L155 45 L145 65 L95 65 Z" fill="#742A2A"/>
    <!-- Bag label -->
    <rect x="85" y="78" width="70" height="75" rx="8" fill="#FFFFFF"/>
    <rect x="92" y="86" width="56" height="12" rx="3" fill="#E53E3E"/>
    <text x="120" y="95" font-family="system-ui, sans-serif" font-size="8" font-weight="bold" fill="#FFFFFF" text-anchor="middle">ROYAL CANIN</text>
    <!-- Cat silhouette on bag -->
    <path d="M110 125 C110 115 116 108 120 108 C124 108 130 115 130 125 C130 133 124 138 120 138 C116 138 110 133 110 125 Z" fill="#E53E3E"/>
    <polygon points="113,110 116,104 118,110" fill="#E53E3E"/>
    <polygon points="122,110 124,104 127,110" fill="#E53E3E"/>
    <rect x="96" y="142" width="48" height="5" rx="2" fill="#E2E8F0"/>
    <!-- Weight Badge -->
    <rect x="100" y="165" width="40" height="18" rx="9" fill="#FFD700"/>
    <text x="120" y="177" font-family="system-ui, sans-serif" font-size="9" font-weight="900" fill="#742A2A" text-anchor="middle">1 KG</text>
  </g>
  <text x="120" y="222" font-family="system-ui, sans-serif" font-size="11" font-weight="bold" fill="#4A5568" text-anchor="middle">Adult Cat Formula</text>
</svg>
