<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 240" width="100%" height="100%">
  <defs>
    <linearGradient id="bg6" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#EBF8FF"/>
      <stop offset="100%" stop-color="#BEE3F8"/>
    </linearGradient>
    <linearGradient id="pointer" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#4FD1C5"/>
      <stop offset="100%" stop-color="#319795"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>
  <rect width="240" height="240" rx="20" fill="url(#bg6)"/>
  <!-- Teaser Wand / Stick -->
  <line x1="45" y1="195" x2="155" y2="85" stroke="#4A5568" stroke-width="6" stroke-linecap="round"/>
  <line x1="40" y1="200" x2="65" y2="175" stroke="#E53E3E" stroke-width="8" stroke-linecap="round"/>
  <!-- Bell -->
  <circle cx="158" cy="82" r="8" fill="#ECC94B"/>
  <circle cx="158" cy="85" r="2" fill="#744210"/>
  <!-- Feathers -->
  <path d="M158 82 Q185 65 200 45 Q180 75 160 84 Z" fill="#ED8936"/>
  <path d="M158 82 Q195 80 208 72 Q185 90 162 86 Z" fill="#9F7AEA"/>
  <path d="M158 82 Q180 100 195 110 Q175 100 160 88 Z" fill="#48BB78"/>
  <!-- Laser Pointer Body -->
  <g transform="translate(60, 60) rotate(-25)">
    <rect x="0" y="0" width="80" height="22" rx="11" fill="url(#pointer)"/>
    <circle cx="15" cy="11" r="5" fill="#E2E8F0"/>
    <circle cx="68" cy="11" r="4" fill="#E53E3E" filter="url(#glow)"/>
    <rect x="35" y="6" width="16" height="10" rx="4" fill="#2C7A7B"/>
  </g>
  <!-- Laser Beam -->
  <line x1="145" y1="42" x2="215" y2="28" stroke="#E53E3E" stroke-width="3" stroke-dasharray="4,2" filter="url(#glow)"/>
  <circle cx="218" cy="27" r="5" fill="#E53E3E" filter="url(#glow)"/>
  <rect x="65" y="195" width="110" height="20" rx="10" fill="#319795"/>
  <text x="120" y="209" font-family="system-ui, sans-serif" font-size="10" font-weight="bold" fill="#FFFFFF" text-anchor="middle">Laser &amp; Bulu Interaktif</text>
</svg>
